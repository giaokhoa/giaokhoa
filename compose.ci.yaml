# compose.ci.yaml — file override CHỈ dùng trong CI bởi workflow .github/workflows/deploy-check.yml, KHÔNG dùng cho deploy thật:
# Dokploy và các lần chạy tay trên máy tự host chỉ dùng một mình compose.yaml như trước, hành vi không đổi.
#
# File này chỉ bổ sung cache layer cho bước build: mỗi service có build đọc cache từ GitHub Actions cache (cache_from, kiểu type=gha) và ghi lại toàn bộ layer sau khi build xong (cache_to, mode=max), mỗi service một scope riêng để các kho cache không lẫn nhau. Runner CI là máy mới ở mỗi lượt chạy nên không có cache layer cục bộ — cache qua GitHub Actions là cách duy nhất giữ lại layer giữa các lượt, giúp các lượt sau khi cache đã ấm chỉ build phần thay đổi.
#
# Ngoài cache build, file này KHÔNG thay đổi bất kỳ cấu hình chạy nào (không environment, không ports, không depends_on, không command):
# khi gộp với compose.yaml, cấu hình chạy của stack giữ nguyên như bản production.
#
# Workflow gộp cả hai file, xuất định nghĩa bằng compose build --print, rồi dùng docker/bake-action để cấp runtime token cho cache gha và nạp image vào runner. compose up --no-build chỉ khởi động image đã có.

services:
  api:
    build:
      cache_from:
        - type=gha,scope=api
      cache_to:
        - type=gha,scope=api,mode=max

  worker:
    build:
      cache_from:
        - type=gha,scope=worker
      cache_to:
        - type=gha,scope=worker,mode=max

  web:
    build:
      cache_from:
        - type=gha,scope=web
      cache_to:
        - type=gha,scope=web,mode=max

  # Service migrate build từ cùng target api với service api (cùng một image), nên dùng chung scope cache "api" với service api.
  migrate:
    build:
      cache_from:
        - type=gha,scope=api
      cache_to:
        - type=gha,scope=api,mode=max
