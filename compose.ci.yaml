
services:
  api:
    build:
      cache_from:
        - type=gha,scope=api
      cache_to:
        - type=gha,scope=api,mode=max

  worker:
    build:
      cache_from:
        - type=gha,scope=worker
      cache_to:
        - type=gha,scope=worker,mode=max

  web:
    build:
      cache_from:
        - type=gha,scope=web
      cache_to:
        - type=gha,scope=web,mode=max

  migrate:
    build:
      cache_from:
        - type=gha,scope=api
      cache_to:
        - type=gha,scope=api,mode=max
