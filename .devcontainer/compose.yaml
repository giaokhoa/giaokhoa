services:
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    working_dir: /giaokhoa
    volumes:
      - ..:/giaokhoa:cached
    command: sleep infinity
    network_mode: service:db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: giaokhoa
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d giaokhoa"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  redis:
    image: redis:7
    restart: unless-stopped
    network_mode: service:db
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
