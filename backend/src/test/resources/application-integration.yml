# Chỉ dùng các service TEST bên ngoài; không H2, không mock PDP, không reset schema, không fallback về DEV.
spring:
  datasource:
    url: ${TEST_DATABASE_URL}
    username: ${TEST_DATABASE_USERNAME}
    password: ${TEST_DATABASE_PASSWORD}
    # Mỗi class IT giữ một ApplicationContext riêng trong cache của Spring tới hết suite;
    # pool mặc định 10 connection cho mỗi context sẽ vượt trần 100 connection của PostgreSQL TEST.
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  flyway:
    enabled: true
    clean-disabled: true
    user: ${TEST_DATABASE_MIGRATOR_USERNAME}
    password: ${TEST_DATABASE_MIGRATOR_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  session:
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${TEST_OIDC_CLIENT_ID}
            client-secret: ${TEST_OIDC_CLIENT_SECRET}
            authorization-grant-type: authorization_code
        provider:
          keycloak:
            issuer-uri: ${TEST_KEYCLOAK_BASE_URL}/realms/${TEST_KEYCLOAK_REALM}
giaokhoa:
  app-origin: ${TEST_APP_ORIGIN}
  keycloak:
    authorization-audience: ${TEST_KEYCLOAK_AUTHZ_AUDIENCE}
    admin-base-url: ${TEST_KEYCLOAK_BASE_URL}
    provisioner:
      client-id: ${TEST_KEYCLOAK_PROVISIONER_CLIENT_ID}
      client-secret: ${TEST_KEYCLOAK_PROVISIONER_CLIENT_SECRET}
