
x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgres://giaokhoa_runtime:${RUNTIME_POSTGRES_PASSWORD:?Can dat RUNTIME_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-giaokhoa}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  CONTROL_PLANE_POOL_MAX: ${CONTROL_PLANE_POOL_MAX:-4}
  SPACE_DB_POOL_MAX: ${SPACE_DB_POOL_MAX:-3}
  SPACE_DB_MAX_POOLS: ${SPACE_DB_MAX_POOLS:-6}
  CONTROL_PLANE_DATABASE_URL: postgres://giaokhoa_control_plane:${CONTROL_PLANE_POSTGRES_PASSWORD:?Can dat CONTROL_PLANE_POSTGRES_PASSWORD trong file .env}@postgres:5432/giaokhoa_control_plane
  SYSTEM_BANK_DATABASE_URL:
  SPACE_NHANTIN_DATABASE_URL:
  SPACE_CONG_CONG_DATABASE_URL:
  PUBLIC_LEARNING_ENABLED: ${PUBLIC_LEARNING_ENABLED:-false}
  DATABASE_SSL: ${DATABASE_SSL:-false}
  DATABASE_TLS_CA_FILE:
  REDIS_TLS_CA_FILE:
  REDIS_URL: redis://redis:6379
  CACHE_REDIS_URL: redis://redis-cache:6379
  JWT_SECRET: ${JWT_SECRET:?Can dat JWT_SECRET trong file .env}
  MFA_ENCRYPTION_KEY:
  BETTER_AUTH_ENABLED: ${BETTER_AUTH_ENABLED:-true}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Can dat BETTER_AUTH_SECRET trong file .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8080}
  BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
  MCP_AS_ENABLED: ${MCP_AS_ENABLED:-true}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
  RESEND_API_KEY:
  MAIL_FROM:
  FILE_STORAGE_DIR: /app/data/files
  FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
  FILE_STORAGE_S3_ENDPOINT:
  FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-us-east-1}
  FILE_STORAGE_S3_BUCKET:
  FILE_STORAGE_S3_ACCESS_KEY_ID:
  FILE_STORAGE_S3_SECRET_ACCESS_KEY:
  FILE_STORAGE_S3_FORCE_PATH_STYLE: ${FILE_STORAGE_S3_FORCE_PATH_STYLE:-false}

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Can dat POSTGRES_PASSWORD trong file .env}
      POSTGRES_DB: ${POSTGRES_DB:-giaokhoa}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-giaokhoa}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4.12
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "900 1 300 10 60 10000", "--maxmemory-policy", "noeviction", "--maxmemory", "${REDIS_MAXMEMORY:-0}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis-cache:
    image: redis:7.4.12
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru", "--maxmemory", "${REDIS_CACHE_MAXMEMORY:-256mb}"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    environment:
      <<: *api-env
      PORT: 3100
    volumes:
      - api-files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://giaokhoa_runtime:${RUNTIME_POSTGRES_PASSWORD:?Can dat RUNTIME_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-giaokhoa}
      CONTROL_PLANE_DATABASE_URL: postgres://giaokhoa_control_plane:${CONTROL_PLANE_POSTGRES_PASSWORD:?Can dat CONTROL_PLANE_POSTGRES_PASSWORD trong file .env}@postgres:5432/giaokhoa_control_plane
      SYSTEM_BANK_DATABASE_URL:
      SPACE_NHANTIN_DATABASE_URL:
      SPACE_CONG_CONG_DATABASE_URL:
      DATABASE_POOL_MAX: ${WORKER_DATABASE_POOL_MAX:-10}
      SPACE_DB_POOL_MAX: ${SPACE_DB_POOL_MAX:-3}
      SPACE_DB_MAX_POOLS: ${SPACE_DB_MAX_POOLS:-6}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_TLS_CA_FILE:
      REDIS_TLS_CA_FILE:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Can dat JWT_SECRET trong file .env}
      FILE_STORAGE_DIR: /app/data/files
      FILE_STORAGE_DRIVER: ${FILE_STORAGE_DRIVER:-local}
      FILE_STORAGE_S3_ENDPOINT:
      FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-us-east-1}
      FILE_STORAGE_S3_BUCKET:
      FILE_STORAGE_S3_ACCESS_KEY_ID:
      FILE_STORAGE_S3_SECRET_ACCESS_KEY:
      FILE_STORAGE_S3_FORCE_PATH_STYLE: ${FILE_STORAGE_S3_FORCE_PATH_STYLE:-false}
      RESEND_API_KEY:
      MAIL_FROM:
      RESEND_RATE_LIMIT_PER_SECOND: ${RESEND_RATE_LIMIT_PER_SECOND:-1}
    volumes:
      - api-files:/app/data/files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const Redis=require('ioredis');const r=new Redis(process.env.REDIS_URL,{maxRetriesPerRequest:1,connectTimeout:2000});r.ping().then(v=>{r.disconnect();process.exit(v==='PONG'?0:1)}).catch(()=>{r.disconnect();process.exit(1)})\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      GIAOKHOA_API_INTERNAL_URL: http://api:3100
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gateway:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    environment:
      GIAOKHOA_TRUSTED_PROXY_CIDRS: ${GIAOKHOA_TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      GIAOKHOA_API_UPSTREAM: ${GIAOKHOA_API_UPSTREAM:-api:3100}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      DATABASE_URL: postgres://giaokhoa_migrator:${MIGRATOR_POSTGRES_PASSWORD:?Can dat MIGRATOR_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-giaokhoa}
      DATABASE_ADMIN_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Can dat POSTGRES_PASSWORD trong file .env}@postgres:5432/postgres
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_TLS_CA_FILE:
      MIGRATION_DATABASE_URL: postgres://giaokhoa_migrator:${MIGRATOR_POSTGRES_PASSWORD:?Can dat MIGRATOR_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-giaokhoa}
      RUNTIME_DATABASE_URL: postgres://giaokhoa_runtime:${RUNTIME_POSTGRES_PASSWORD:?Can dat RUNTIME_POSTGRES_PASSWORD trong file .env}@postgres:5432/${POSTGRES_DB:-giaokhoa}
      CONTROL_PLANE_DATABASE_URL: postgres://giaokhoa_control_plane:${CONTROL_PLANE_POSTGRES_PASSWORD:?Can dat CONTROL_PLANE_POSTGRES_PASSWORD trong file .env}@postgres:5432/giaokhoa_control_plane
      SYSTEM_BANK_DATABASE_URL: ${SYSTEM_BANK_DATABASE_URL:-}
      FLEET_BACKUP_DIR: /app/data/fleet-backups
      FLEET_BACKUP_ENCRYPTION_KEY:
    volumes:
      - fleet-backups:/app/data/fleet-backups
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - "node dist/modules/fleet/runtime-roles-setup.js && node dist/modules/control-plane/control-plane-setup.js && node node_modules/@giaokhoa/db/dist/migrate/run.js centre && node dist/modules/system-bank/system-bank-centre-tables-setup.js && node node_modules/@giaokhoa/db/dist/migrate/run.js control-plane && node dist/modules/tenants/centre-schema-delta-ensure.js && if [ -n \"$SYSTEM_BANK_DATABASE_URL\" ]; then node dist/modules/system-bank/system-bank-setup.js && node node_modules/@giaokhoa/db/dist/migrate/run.js system-bank; fi"

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    profiles: ["seed"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/modules/seed/review-seed.js"]


volumes:
  pgdata:
  redisdata:
  api-files:
  fleet-backups:
  caddy-data:
  caddy-config:
