name: T004 build and infrastructure

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.devcontainer/compose.yml'
      - 'infra/**'
      - '.github/workflows/t004-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify Spring Boot
        run: ./backend/mvnw -B -ntp -f backend/pom.xml verify
      - name: Verify Next.js
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run lint
          npm --prefix frontend run test
          npm --prefix frontend run build

  infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: ci-t004-dev
      TEST_PROJECT: ci-t004-test
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and Caddy configuration
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml config -q
          docker compose -p "$TEST_PROJECT" -f infra/compose.test.yaml config -q
          docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml config --format json | jq -e '(.services.keycloak.ports // [] | length) == 0'
          docker run --rm -v "$PWD/infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Start isolated DEV-shaped and TEST stacks
        run: |
          set -euo pipefail
          docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml up -d app-db keycloak-db keycloak gateway mailpit
          docker compose -p "$TEST_PROJECT" -f infra/compose.test.yaml up -d
      - name: Verify real Keycloak endpoints, PostgreSQL and network isolation
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 5 -H 'Host: auth.giaokhoa.localhost:8081' http://127.0.0.1:8081/realms/master/.well-known/openid-configuration > /tmp/dev-issuer.json \
              && curl -fsS --max-time 5 -H 'Host: auth.test.giaokhoa.localhost:18081' http://127.0.0.1:18081/realms/master/.well-known/openid-configuration > /tmp/test-issuer.json; then
              break
            fi
            sleep 3
          done
          jq -e '.issuer == "http://auth.giaokhoa.localhost:8081/realms/master"' /tmp/dev-issuer.json
          jq -e '.issuer == "http://auth.test.giaokhoa.localhost:18081/realms/master"' /tmp/test-issuer.json
          docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml exec -T app-db psql -U giaokhoa -d giaokhoa -Atc 'select current_database()' | grep -x giaokhoa
          docker compose -p "$TEST_PROJECT" -f infra/compose.test.yaml exec -T test-app-db psql -U giaokhoa_test -d giaokhoa_test -Atc 'select current_database()' | grep -x giaokhoa_test
          docker volume inspect "${COMPOSE_PROJECT_NAME}_app_data" "${COMPOSE_PROJECT_NAME}_keycloak_data" "${TEST_PROJECT}_test_app_data" "${TEST_PROJECT}_test_keycloak_data" > /dev/null
          docker network inspect "${COMPOSE_PROJECT_NAME}_default" "${TEST_PROJECT}_default" > /dev/null
          docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml exec -T app-db psql -U giaokhoa -d giaokhoa -v ON_ERROR_STOP=1 -c 'create table ci_dev_marker (id int)'
          test "$(docker compose -p "$TEST_PROJECT" -f infra/compose.test.yaml exec -T test-app-db psql -U giaokhoa_test -d giaokhoa_test -Atc "select to_regclass('public.ci_dev_marker') is null")" = t
          docker compose -p "$TEST_PROJECT" -f infra/compose.test.yaml exec -T test-app-db psql -U giaokhoa_test -d giaokhoa_test -v ON_ERROR_STOP=1 -c 'create table ci_test_marker (id int)'
          test "$(docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml exec -T app-db psql -U giaokhoa -d giaokhoa -Atc "select to_regclass('public.ci_test_marker') is null")" = t
      - name: Check Caddy routing and Keycloak-to-gateway network access
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/t004-stub.py" <<'PY'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from time import sleep

          class Handler(BaseHTTPRequestHandler):
              def do_GET(self): self.reply()
              def do_POST(self): self.reply()
              def reply(self):
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b'spring' if self.server.server_port == 8080 else b'next')
              def log_message(self, *args): pass

          for port in (8080, 3001):
              Thread(target=ThreadingHTTPServer(('0.0.0.0', port), Handler).serve_forever, daemon=True).start()
          while True: sleep(3600)
          PY
          docker run -d --name ci-t004-stub --network "${COMPOSE_PROJECT_NAME}_default" --network-alias app -v "$RUNNER_TEMP/t004-stub.py:/stub.py:ro" python:3.13-alpine python /stub.py
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 3 -H 'Host: giaokhoa.localhost:3000' http://127.0.0.1:3000/ > /tmp/ui-result; then break; fi
            sleep 2
          done
          test "$(cat /tmp/ui-result)" = next
          for path in /api/session /oauth2/authorization/keycloak /login/oauth2/code/keycloak /logout/connect/back-channel/keycloak; do
            test "$(curl -fsS --max-time 8 -X POST -H 'Host: giaokhoa.localhost:3000' "http://127.0.0.1:3000$path")" = spring
          done
          docker run --rm --network "${COMPOSE_PROJECT_NAME}_default" curlimages/curl:8.16.0 -fsS --max-time 12 http://giaokhoa.localhost:3000/ | grep -x next
          keycloak_id=$(docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml ps -q keycloak)
          docker run --rm --network "container:$keycloak_id" curlimages/curl:8.16.0 -fsS --max-time 12 http://giaokhoa.localhost:3000/ | grep -x next
      - name: Collect diagnostic logs
        if: failure()
        run: |
          docker ps -a
          docker compose -p "$COMPOSE_PROJECT_NAME" -f .devcontainer/compose.yml -f infra/compose.dev.yaml logs --tail=80 || true
          docker compose -p "$TEST_PROJECT" -f infra/compose.test.yaml logs --tail=80 || true
