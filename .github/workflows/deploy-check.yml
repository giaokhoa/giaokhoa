# Workflow kiểm chứng khả năng deploy của stack tự host ngay trong CI.
#
# Mục đích: kiểm tra khả năng dựng stack production tự host qua Compose, API, SSR và gateway. Không khởi động dịch vụ xác thực đã loại bỏ.
#
# Chuỗi status context của job dưới đây là "deploy-check / verify-stack" (theo khuôn "<tên workflow> / <tên job>") — đây là chuỗi cần chọn trong ruleset của nhánh main.
#
# Mọi lệnh compose trong workflow đều gộp thêm file override compose.ci.yaml (chỉ dùng trong CI) để các build dùng cache layer qua GitHub Actions cache; file compose.yaml chính giữ nguyên cho đường deploy thật.

name: deploy-check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Huỷ lượt kiểm của head cũ ngay khi PR có head mới: group tách riêng theo từng PR (dự phòng bằng ref cho lượt chạy tay qua workflow_dispatch) và mang tên workflow này nên không huỷ lẫn với workflow CI; cổng merge vẫn xét lượt completed/success của head cuối như cũ.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-stack:
    name: verify-stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Dựng builder Buildx (driver docker-container): driver mặc định của Docker trên runner không xuất được cache layer, nên cần builder này để cache_from/cache_to kiểu type=gha khai trong compose.ci.yaml hoạt động (đọc cache từ GitHub Actions cache trước khi build và ghi lại sau khi build).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Dùng workflow command chính thức GITHUB_ENV thay cho tạo .env.example rồi sed/grep từng bí mật. Compose đọc trực tiếp biến môi trường của runner, các giá trị tùy chọn lấy mặc định từ compose.yaml. Mỗi bí mật sinh riêng và được mask trong log.
      - name: Generate CI environment variables
        run: |
          for name in POSTGRES_PASSWORD CONTROL_PLANE_POSTGRES_PASSWORD RUNTIME_POSTGRES_PASSWORD MIGRATOR_POSTGRES_PASSWORD JWT_SECRET BETTER_AUTH_SECRET; do
            secret=$(openssl rand -hex 32)
            echo "::add-mask::$secret"
            printf '%s=%s\n' "$name" "$secret" >> "$GITHUB_ENV"
          done

      - name: Validate compose configuration
        run: docker compose -f compose.yaml -f compose.ci.yaml config > /dev/null

      # Compose xuất định nghĩa Bake cùng tag/cache của từng service; action Docker cấp runtime token cho cache gha mà bước shell không tự nhận được. Không tự dựng lại định nghĩa build riêng.
      - name: Export the Compose build definition
        run: docker compose -f compose.yaml -f compose.ci.yaml build --print api worker web migrate > "$RUNNER_TEMP/compose-build.json"

      - name: Build the stack with GitHub Actions cache
        uses: docker/bake-action@v7
        with:
          source: .
          files: ${{ runner.temp }}/compose-build.json
          load: true

      # Service migrate tự chạy trước và phải thành công thì api/worker mới khởi động; chỉ dùng image vừa build, không build lại ở shell.
      - name: Verify Caddy config with current trusted-proxy policy
        run: |
          # Không cấu hình ingress riêng trong CI thì Caddy không được
          # tin cả Docker bridge: cổng host dùng NAT có thể bị giả IP.
          if [ -z "${GIAOKHOA_TRUSTED_PROXY_CIDRS:-}" ]; then
            effective=$(docker compose -f compose.yaml -f compose.ci.yaml config --format json | jq -r '.services.gateway.environment.GIAOKHOA_TRUSTED_PROXY_CIDRS')
            test "$effective" = "127.0.0.1/32"
          fi
          docker compose -f compose.yaml -f compose.ci.yaml run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Start the stack
        run: docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build

      # HTTP probe qua cổng công khai Caddy. Docker Compose đã chờ healthcheck của API/web qua depends_on; curl có retry chính thức thay cho vòng lặp shell chờ từng dịch vụ.
      - name: Verify API through the public gateway
        run: |
          curl --fail --silent --show-error --retry 60 --retry-delay 5 --retry-all-errors --max-time 5 \
            http://127.0.0.1:8080/api/v1/health -o smoke-health.json
          jq -e '.status == "ok" and .checks.database == "up" and .checks.redis == "up"' smoke-health.json

      # Chạy với USER node trong hai image thật, trên named volume bền
      # `api-files` Compose vừa tạo. Ghi/đọc hai chiều sẽ bắt lỗi
      # ownership/perms khi mount volume che quyền thư mục image.
      - name: Verify non-root API and worker share writable file volume
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api node - "$GITHUB_RUN_ID" <<'NODE'
          const fs = require('node:fs');
          const path = `/app/data/files/.audit-api-${process.argv[2]}`;
          if (process.getuid() === 0) throw new Error('API đang chạy root');
          fs.writeFileSync(path, 'api-written', { flag: 'wx', mode: 0o600 });
          if (fs.readFileSync(path, 'utf8') !== 'api-written') process.exit(1);
          NODE
          docker compose -f compose.yaml -f compose.ci.yaml exec -T worker node - "$GITHUB_RUN_ID" <<'NODE'
          const fs = require('node:fs');
          const api = `/app/data/files/.audit-api-${process.argv[2]}`;
          const worker = `/app/data/files/.audit-worker-${process.argv[2]}`;
          if (process.getuid() === 0) throw new Error('Worker đang chạy root');
          if (fs.readFileSync(api, 'utf8') !== 'api-written') process.exit(1);
          fs.writeFileSync(worker, 'worker-written', { flag: 'wx', mode: 0o600 });
          NODE
          docker compose -f compose.yaml -f compose.ci.yaml exec -T api node - "$GITHUB_RUN_ID" <<'NODE'
          const fs = require('node:fs');
          const root = '/app/data/files/';
          const api = root + '.audit-api-' + process.argv[2];
          const worker = root + '.audit-worker-' + process.argv[2];
          if (fs.readFileSync(worker, 'utf8') !== 'worker-written') process.exit(1);
          fs.unlinkSync(worker);
          fs.unlinkSync(api);
          NODE

      # Better Auth và MCP được mount thẳng lên Express, bên ngoài
      # guard Nest: preflight phải qua CORS middleware trước khi auth
      # đọc body, cả khi origin không đáng tin.
      - name: Verify Better Auth and MCP CORS preflight
        run: |
          for path in /api/v1/auth/sign-in/username /mcp; do
            headers=$(curl -fsS -i -X OPTIONS "http://127.0.0.1:8080$path" \
              -H 'Origin: http://localhost:8080' -H 'Access-Control-Request-Method: POST' | tr -d '\r')
            printf '%s\n' "$headers" | grep -qi '^access-control-allow-origin: http://localhost:8080$'
            printf '%s\n' "$headers" | grep -qi '^access-control-allow-credentials: true$'
            blocked=$(curl -fsS -i -X OPTIONS "http://127.0.0.1:8080$path" \
              -H 'Origin: https://untrusted.example' -H 'Access-Control-Request-Method: POST' | tr -d '\r')
            if printf '%s\n' "$blocked" | grep -qi '^access-control-allow-origin: https://untrusted.example$'; then
              echo "Preflight cho phép origin ngoài danh sách tại $path" >&2
              exit 1
            fi
          done

      # Nghiệm thu Redis/BullMQ qua cấu hình đang chạy (không chỉ chuỗi
      # trong Compose). Keycloak và kc-db phải biến mất khỏi toàn stack.
      - name: Verify Redis policy and retired Keycloak services
        run: |
          services=$(docker compose -f compose.yaml -f compose.ci.yaml config --services)
          if printf '%s\n' "$services" | grep -Eq '^(keycloak|kc-db)$'; then
            echo "Cấu hình còn service Keycloak đã bị loại bỏ" >&2
            exit 1
          fi
          policy=$(docker compose -f compose.yaml -f compose.ci.yaml exec -T redis redis-cli --raw CONFIG GET maxmemory-policy | tail -n 1)
          budget=$(docker compose -f compose.yaml -f compose.ci.yaml exec -T redis redis-cli --raw CONFIG GET maxmemory | tail -n 1)
          test "$policy" = noeviction
          printf '%s\n' "$budget" | grep -Eq '^[0-9]+$'
          echo "Redis: maxmemory-policy=$policy, maxmemory=$budget bytes"
          # Redis cache riêng PHẢI dùng eviction (không phải Redis BullMQ).
          cache_policy=$(docker compose -f compose.yaml -f compose.ci.yaml exec -T redis-cache redis-cli --raw CONFIG GET maxmemory-policy | tail -n 1)
          cache_budget=$(docker compose -f compose.yaml -f compose.ci.yaml exec -T redis-cache redis-cli --raw CONFIG GET maxmemory | tail -n 1)
          test "$cache_policy" = allkeys-lru
          test "$cache_budget" -gt 0
          echo "Redis cache: maxmemory-policy=$cache_policy, maxmemory=$cache_budget bytes"

      # Cổng nghiệm thu SSR động: loader nhận JSON thực từ API nội bộ, và HTML chứa dữ liệu đã render trước khi hydrate.
      - name: Verify SSR, CSP and cache isolation
        run: |
          curl -fsS --max-time 15 http://127.0.0.1:8080/health -o smoke-ssr.html
          grep -q 'ok</dd>' smoke-ssr.html
          grep -q 'up</dd>' smoke-ssr.html
          grep -Eq '<dd>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:' smoke-ssr.html
          curl -fsS -D smoke-login.headers -o smoke-login.html http://127.0.0.1:8080/login
          grep -qi '^content-security-policy: .*frame-ancestors .none.' smoke-login.headers
          grep -qi '^x-content-type-options: nosniff' smoke-login.headers
          grep -qi '^cache-control: private, no-cache' smoke-login.headers
          curl -fsS -o /dev/null http://127.0.0.1:8080/

      # Kiểm chứng sticky cookie trên hai Socket.IO Server thật với
      # Redis adapter dùng chung, qua chính Caddy production. Nếu Caddy
      # xem hostname Docker có hai A record là MỘT upstream thì polling
      # có thể đổi replica giữa handshake/POST dẫn tới 400 unknown SID.
      # Dùng hostname container riêng cho replica thứ hai, không tạo
      # service mới hoặc cổng host mới trên production.
      - name: Verify Socket.IO polling affinity across two API replicas
        run: |
          trap 'docker rm -f giaokhoa-api-2 >/dev/null 2>&1 || true; docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build --force-recreate gateway || true' EXIT
          docker compose -f compose.yaml -f compose.ci.yaml run -d --no-deps --name giaokhoa-api-2 api
          ready=0
          for attempt in $(seq 1 30); do
            if docker exec giaokhoa-api-2 node -e "fetch('http://127.0.0.1:3100/api/v1/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = 1
          export GIAOKHOA_API_UPSTREAM='api:3100 giaokhoa-api-2:3100'
          docker compose -f compose.yaml -f compose.ci.yaml run --rm --no-deps gateway caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose -f compose.yaml -f compose.ci.yaml up -d --no-build --force-recreate gateway
          : > "$RUNNER_TEMP/socket-affinity-cookies.txt"
          for i in $(seq 1 12); do
            curl -fsS --retry 10 --retry-delay 1 --retry-all-errors --max-time 10 \
              -H 'Origin: http://localhost:8080' \
              -D "$RUNNER_TEMP/socket-affinity-headers.txt" \
              -o "$RUNNER_TEMP/socket-affinity-body.txt" \
              "http://127.0.0.1:8080/socket.io/?EIO=4&transport=polling&t=$i"
            cookie=$(grep -i '^set-cookie: api_affinity=' "$RUNNER_TEMP/socket-affinity-headers.txt" | head -n 1 | cut -d ' ' -f 2 | cut -d ';' -f 1 | tr -d '\r')
            sid=$(node -e 'const s=require("node:fs").readFileSync(process.argv[1],"utf8");if(!s.startsWith("0"))process.exit(1);console.log(JSON.parse(s.slice(1)).sid)' "$RUNNER_TEMP/socket-affinity-body.txt")
            test -n "$cookie" && test -n "$sid"
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST \
              -H 'Origin: http://localhost:8080' \
              -H "Cookie: $cookie" -H 'Content-Type: text/plain;charset=UTF-8' \
              --data-binary '40' \
              "http://127.0.0.1:8080/socket.io/?EIO=4&transport=polling&sid=$sid")
            test "$status" = 200 || { echo "Engine.IO SID mất affinity: HTTP $status" >&2; exit 1; }
            printf '%s\n' "$cookie" >> "$RUNNER_TEMP/socket-affinity-cookies.txt"
          done
          distinct=$(sort -u "$RUNNER_TEMP/socket-affinity-cookies.txt" | wc -l)
          test "$distinct" -ge 2 || { echo "Caddy không phân phối tới cả 2 upstream" >&2; exit 1; }
          echo "12 Engine.IO polling handshakes + POST đạt trên $distinct upstream có cookie affinity."
          unset GIAOKHOA_API_UPSTREAM

      # Health phải trả 503 TRÊN HTTP THẬT khi một phụ thuộc ngừng
      # (unit test controller không kiểm chứng wiring Redis/PG hay
      # healthcheck lắng nghe). Chạy sau smoke để không làm nhiễu các
      # bước xác minh khác; gọi HTTP loopback từ chính container API,
      # không đi qua gateway đang tự chặn upstream unhealthy.
      - name: Verify HTTP 503 on real Redis and PostgreSQL outages
        run: |
          # Luôn khởi động lại phụ thuộc trước khi bước cleanup/log chạy,
          # kể cả khi assertion 503 thất bại.
          trap 'docker compose -f compose.yaml -f compose.ci.yaml start redis postgres || true' EXIT
          assert_down() {
            docker compose -f compose.yaml -f compose.ci.yaml exec -T api node - "$1" <<'NODE'
          const expected = process.argv[2];
          const response = await fetch('http://127.0.0.1:3100/api/v1/health', {
            signal: AbortSignal.timeout(15000),
          });
          const data = await response.json();
          console.log(JSON.stringify({
            status: response.status, overall: data.status, checks: data.checks,
          }));
          if (response.status !== 503 || data.status !== 'error' || data.checks?.[expected] !== 'down') {
            process.exitCode = 1;
          }
          NODE
          }
          docker compose -f compose.yaml -f compose.ci.yaml stop redis
          assert_down redis
          docker compose -f compose.yaml -f compose.ci.yaml start redis
          docker compose -f compose.yaml -f compose.ci.yaml stop postgres
          assert_down database
          docker compose -f compose.yaml -f compose.ci.yaml start postgres

      # Lưu chứng cứ trước khi dọn stack, kể cả khi một container chưa
      # qua healthcheck và Compose trả lỗi ngay ở bước khởi động.
      - name: Diagnose failed stack before cleanup
        if: failure()
        run: |
          docker compose -f compose.yaml -f compose.ci.yaml ps -a || true
          docker compose -f compose.yaml -f compose.ci.yaml logs --no-color --tail 250 api worker migrate redis postgres web gateway || true
          api_id=$(docker compose -f compose.yaml -f compose.ci.yaml ps -a -q api)
          if [ -n "$api_id" ]; then
            docker inspect --format '{{json .State.Health}}' "$api_id" || true
            docker inspect --format '{{json .State}}' "$api_id" || true
          fi

      - name: Tear down the stack
        if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml down -v
