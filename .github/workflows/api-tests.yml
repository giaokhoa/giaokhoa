name: Kiểm thử Database và API

on:
  push:
    branches: [feat/files-subsystem]
  pull_request:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: giaokhoa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d giaokhoa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      s3mock:
        image: adobe/s3mock:5.1.0
        env:
          COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: 'false'
          COM_ADOBE_TESTING_S3MOCK_STORE_REGION: us-east-1
          COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: giaokhoa-assets
        ports:
          - 9090:9090
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Cài dependencies
        run: pnpm install --frozen-lockfile
      - name: Tạo cấu hình E2E cô lập
        run: |
          cat > apps/api/.env.test <<'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/giaokhoa_test
          S3_ENDPOINT=http://127.0.0.1:9090
          S3_REGION=us-east-1
          S3_BUCKET=giaokhoa-assets
          S3_ACCESS_KEY_ID=local
          S3_SECRET_ACCESS_KEY=local
          BETTER_AUTH_SECRET=only-for-isolated-ci-tests-do-not-reuse
          BETTER_AUTH_URL=http://localhost:3000
          BETTER_AUTH_TRUSTED_ORIGINS=http://localhost:5173,http://localhost:3001
          EOF
      - name: Build API và packages
        run: pnpm exec turbo run build --filter=@giaokhoa/api
      - name: Kiểm thử tích hợp PostgreSQL của database
        run: DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/giaokhoa_test pnpm --filter @giaokhoa/database test:int
      - name: Kiểm thử tích hợp kho S3 của API
        run: pnpm --filter @giaokhoa/api test:int
      - name: Chạy HTTP E2E
        run: pnpm --filter @giaokhoa/api test:e2e
