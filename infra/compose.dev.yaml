# Dùng cùng .devcontainer/compose.yml và COMPOSE_PROJECT_NAME HIỆN CÓ.
# Không chạy override này như một stack độc lập và không xóa volume DEV.
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME to the existing DevContainer project}

services:
  keycloak:
    ports: !reset []
    environment:
      KC_HOSTNAME: http://auth.giaokhoa.localhost:8081
      KC_PROXY_HEADERS: xforwarded

  gateway:
    image: caddy:2.10.2-alpine
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8081:8081"
    volumes:
      # Tương đối theo Compose file đầu tiên (.devcontainer/compose.yml).
      - ../infra/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      default:
        aliases:
          - auth.giaokhoa.localhost
          - giaokhoa.localhost
    depends_on:
      - keycloak

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "127.0.0.1:8025:8025"
